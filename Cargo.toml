[package]
name = "lasercad"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "LaserCAD v2 — KISS 2D CAD for laser cutting"
authors = ["LaserCAD contributors"]
repository = "https://github.com/grstein/LaserCAD-R14-V2"

[dependencies]
base64 = "0.22"
directories = "5"
eframe = "0.29"
egui = "0.29"
png = "0.18"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rfd = { version = "0.14", default-features = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

# Written invariants from AGENTS.md, enforced as lints. They warn here; the
# gate's `-D warnings` turns them into errors. Exceptions carry
# `#[expect(.., reason = "..")]`; test code is exempted via `clippy.toml`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
float_cmp = "warn"

# LCV-152: faster edit-build-test loop. Line tables keep panic backtraces
# useful at a fraction of the full debuginfo; dependencies are built once with
# light optimisation so egui-heavy tests run faster, while this crate stays at
# opt-level 0 for quick rebuilds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "lasercad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "LaserCAD v2 — KISS 2D CAD for laser cutting"
authors = ["LaserCAD contributors"]
repository = ""

[dependencies]
directories = "5"
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rfd = { version = "0.14", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

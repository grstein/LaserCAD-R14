[package]
name = "lasercad"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "LaserCAD v2 — KISS 2D CAD for laser cutting"
authors = ["LaserCAD contributors"]
repository = ""

[dependencies]
eframe = "0.29"
egui = "0.29"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

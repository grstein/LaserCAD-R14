<?xml version="1.0" encoding="UTF-8"?>
<!-- LCV-179: text imported as glyph outlines in the named font. The corpus
     imports with no font, so both texts are skipped and reported; with the
     bundled LCV Test Sans (tests/it/io_svg/text.rs) they become lines and
     quadratic Béziers. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100">
  <text x="10" y="50" font-family="'LCV Test Sans', sans-serif" font-size="20" fill="#ff0000">Hello, laser</text>
  <text x="50" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="none" stroke="#0000ff">o<tspan dy="-4">l</tspan></text>
</svg>

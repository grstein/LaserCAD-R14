<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100">
  <defs>
    <symbol id="icon-cross" viewBox="0 0 24 24">
      <line x1="0" y1="0" x2="24" y2="24"/>
      <line x1="24" y1="0" x2="0" y2="24"/>
    </symbol>
    <symbol id="icon-ring" viewBox="0 0 10 20" preserveAspectRatio="xMinYMin meet">
      <circle cx="5" cy="5" r="5"/>
    </symbol>
  </defs>
  <g stroke="#0000ff" fill="none">
    <use href="#icon-cross" x="10" y="10" width="48" height="48"/>
    <use href="#icon-ring" x="60" y="10" width="20" height="20"/>
    <switch>
      <g systemLanguage="fr"><line x1="0" y1="90" x2="10" y2="90"/></g>
      <g systemLanguage="en-GB, fr"><line x1="0" y1="95" x2="10" y2="95"/></g>
      <line x1="0" y1="80" x2="10" y2="80"/>
    </switch>
  </g>
</svg>

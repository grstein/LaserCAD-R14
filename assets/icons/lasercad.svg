<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Laser-cutter work bed outline -->
  <rect x="10" y="10" width="44" height="44" rx="2"
        fill="none" stroke="#303030" stroke-width="3"/>
  <!-- Laser beam ray from top-left to focal point -->
  <line x1="10" y1="10" x2="32" y2="32"
        stroke="#E53935" stroke-width="2" stroke-linecap="round"/>
  <!-- Focal point at beam center -->
  <circle cx="32" cy="32" r="4" fill="#E53935"/>
</svg>

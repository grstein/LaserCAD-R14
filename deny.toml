# cargo-deny: supply-chain policy. Run `cargo deny check`; CI job `deny`.
# Not part of scripts/gate.sh (the gate needs no extra tools).

[graph]
all-features = false

[advisories]
version = 2
# Vulnerabilities are always errors in v2. v2 has no "warn" level for
# unmaintained crates, so only direct deps fail; transitive ones (paste,
# ttf-parser via egui/eframe, 2026-09) are not ours to swap and pass.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # ttf-parser is a direct dependency for glyph outlines (ADR 0017) and is
    # already in the tree through winit's sctk-adwaita/ab_glyph. Unmaintained,
    # not vulnerable; no safe upgrade exists. Revisit with skrifa.
    { id = "RUSTSEC-2026-0192", reason = "ADR 0017 outlines; shared with winit; unmaintained only" },
]

[licenses]
version = 2
# Every license below is compatible with shipping the binary under
# `MIT OR Apache-2.0`. Derived from the actual dependency tree
# (`cargo metadata`); add a license only when a new dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    # File-level copyleft: dirs-sys -> option-ext, mockito (dev) -> colored.
    "MPL-2.0",
    # egui's bundled fonts (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
